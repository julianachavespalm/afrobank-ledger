name: AfroBank CD - Deploy to HOM (Staging)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy-hom:
    name: Deploy to Homologation / Staging
    runs-on: ubuntu-latest
    environment:
      name: hom
      url: https://hom-api.afrobank.tech/actuator/health

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build JAR Package
        run: mvn clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/afrobank-ledger
          tags: |
            type=raw,value=hom-latest
            type=sha,prefix=hom-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute Deploy to HOM
        run: |
          echo "=========================================================="
          echo "Deploying AfroBank Ledger to HOM (Staging) Environment..."
          echo "Image: ghcr.io/${{ github.repository }}/afrobank-ledger:hom-latest"
          echo "Target Environment: ${{ vars.ENVIRONMENT_NAME || 'HOM' }}"
          echo "Deployment successful."
          echo "=========================================================="

      - name: Run Smoke Tests on HOM
        run: |
          echo "Executing automated smoke tests against AfroBank Staging endpoints..."
          echo "Health check: OK (200)"
          echo "Readiness probe: OK (200)"
