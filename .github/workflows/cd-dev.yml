name: AfroBank CD - Deploy to DEV

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy-dev:
    name: Deploy to Development Environment
    runs-on: ubuntu-latest
    environment:
      name: dev

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build JAR Package
        run: ./mvnw clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: afrobank-ledger
          tags: |
            type=raw,value=dev-latest
            type=sha,prefix=dev-

      - name: Build Container Image (Validation)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute Deploy Simulation to DEV
        run: |
          echo "=========================================================="
          echo "Validating AfroBank Ledger container for DEV..."
          echo "Container build validation: SUCCESS"
          echo "Deployment pipeline completed successfully."
          echo "=========================================================="
