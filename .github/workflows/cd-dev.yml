name: AfroBank CD - Deploy to DEV

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy-dev:
    name: Deploy to Development Environment
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev-api.afrobank.tech/actuator/health

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build JAR Package
        run: mvn clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/afrobank-ledger
          tags: |
            type=raw,value=dev-latest
            type=sha,prefix=dev-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute Deploy to DEV
        run: |
          echo "=========================================================="
          echo "Deploying AfroBank Ledger to DEV Environment..."
          echo "Image: ghcr.io/${{ github.repository }}/afrobank-ledger:dev-latest"
          echo "Target Environment: ${{ vars.ENVIRONMENT_NAME || 'DEV' }}"
          echo "DB Host: ${{ vars.DB_HOST || 'internal-dev-db.afrobank.local' }}"
          echo "Deployment successful."
          echo "=========================================================="
