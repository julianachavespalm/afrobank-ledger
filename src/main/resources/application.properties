# ==============================================================================
# AfroBank - Microsserviço de Ledger Financeiro (afrobank-ledger)
# ==============================================================================
spring.application.name=afrobank-ledger

# Configuração de Banco de Dados Local (H2 por padrão para Dev/Test)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:afrobankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator / Observabilidade Básica
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Estruturado
logging.level.tech.afrobank=INFO
logging.level.org.springframework.web=INFO
