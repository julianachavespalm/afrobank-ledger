version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: afrobank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-afrobank_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-afrobank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afrobank_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afrobank} -d ${POSTGRES_DB:-afrobank_ledger}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - afrobank-network

  redis:
    image: redis:7-alpine
    container_name: afrobank-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - afrobank-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: afrobank-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L622nShTUiTwyA3JCUrBg
    networks:
      - afrobank-network

  afrobank-ledger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afrobank-ledger
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-afrobank_ledger}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-afrobank}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-afrobank_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - afrobank-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  afrobank-network:
    driver: bridge
